<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f131c">
    <title>{% block title %}Gather — Event ticketing{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    {% block head %}{% endblock %}
  </head>
  <body data-page="{% block page_name %}{% endblock %}" {% block body_attributes %}{% endblock %}>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="Gather home">
        <span class="brand-mark material-symbols-outlined" aria-hidden="true">confirmation_number</span>
        <span>Gather</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ url_for('index') }}">Events</a>
        <a href="{{ url_for('registrations_page') }}">My registrations</a>
        <a href="{{ url_for('organizer_page') }}">Organizer</a>
      </nav>
      <div class="profile-chip">
        <span class="avatar" aria-hidden="true">G</span>
        <span id="current-user-label">Identity not set</span>
      </div>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <a class="brand brand-small" href="{{ url_for('index') }}">Gather</a>
      <span>Event registration made simple</span>
      <nav aria-label="Footer navigation">
        <a href="{{ url_for('index') }}">Events</a>
        <a href="{{ url_for('registrations_page') }}">My registrations</a>
        <a href="{{ url_for('organizer_page') }}">Organizer</a>
      </nav>
    </footer>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
